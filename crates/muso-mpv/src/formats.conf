# mpv's own defaults for the options muso reads to tell music and covers
# from other files, copied from mpv's options/options.c. These options only
# exist since mpv 0.39; with an older libmpv muso uses this file instead.
# With a newer one mpv's values win, including any `mpv-audio-exts=` and the
# like set in muso.conf.
audio-exts=aac,ac3,aiff,ape,au,dff,dsf,dts,eac3,flac,m4a,mka,mp1,mp2,mp3,mpc,oga,ogg,ogm,opus,tak,thd,tta,wav,wma,wv
image-exts=avif,bmp,gif,heic,heif,j2k,jp2,jpeg,jpg,jxl,png,qoi,svg,tga,tif,tiff,webp
cover-art-whitelist=AlbumArt,Album,cover,front,AlbumArtSmall,Folder,.folder,thumb
