# muso's built-in key bindings, in mpv's input.conf format. A user's
# ~/.config/muso/input.conf goes over these; bind a key to `ignore` to drop
# one of them.

SPACE cycle pause
LEFT seek -5
RIGHT seek 5
UP add volume 2
DOWN add volume -2
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2
< playlist-prev
> playlist-next
m cycle mute
s cycle shuffle
r cycle repeat
t cycle ontop
l show playlists
b show library
q show queue
/ search
o open
n play-next
Shift+UP move up
Shift+DOWN move down
DEL remove
Ctrl+, settings
? help
