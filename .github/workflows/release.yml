# Pushing a tag like v0.2.0 builds muso and publishes a GitHub release with
# a tarball of the binary. GTK 4 and libmpv come from the user's distro.

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml" >&2
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libmpv-dev libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release -p muso-gtk
      - name: Pack
        run: |
          name=muso-${GITHUB_REF_NAME#v}-x86_64-linux
          mkdir "$name"
          cp target/release/muso README.md LICENSE data/io.github.arngory.muso.desktop "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" muso-*.tar.gz* --title "muso ${GITHUB_REF_NAME#v}" --generate-notes
